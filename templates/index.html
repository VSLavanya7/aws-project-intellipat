<form action="/getemployee" method="POST" enctype="multipart/form-data">
    <button type="submit">GET EMPLOYEE INFORMATION</button>

    <label>Employee ID:</label>
    <input type="number" name="empid" value="{{ employee[0] if employee else '' }}">

    <label>First Name:</label>
    <input type="text" name="firstname" value="{{ employee[1] if employee else '' }}">

    <label>Last Name:</label>
    <input type="text" name="lastname" value="{{ employee[2] if employee else '' }}">

    <label>Primary Skills:</label>
    <input type="text" name="skills" value="{{ employee[3] if employee else '' }}">

    <label>Location:</label>
    <input type="text" name="location" value="{{ employee[4] if employee else '' }}">

    <label for="document">Attach Document:</label>
    <br>
    <input type="file" id="document" name="document">
    <br><br>

    <button type="submit" formaction="/updateemployee">UPDATE EMPLOYEE</button>
</form>
